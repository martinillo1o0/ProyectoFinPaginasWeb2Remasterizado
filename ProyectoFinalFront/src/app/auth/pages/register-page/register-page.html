<div class="mx-auto max-w-md py-12"><h1 class="mb-2 text-3xl font-bold">Crear cuenta</h1><p class="mb-8 opacity-70">Crea tu cuenta para crear playlists.</p>@if (errorMessage()) { <div class="alert alert-error mb-5">{{ errorMessage() }}</div> }<form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
<label class="form-control"><span class="label-text">Nombre completo</span><input class="input input-bordered w-full" formControlName="fullName" />@if (form.controls.fullName.touched && form.controls.fullName.invalid) { <span class="label-text-alt text-error">El nombre es obligatorio.</span> }</label>
<label class="form-control"><span class="label-text">Correo electrónico</span><input class="input input-bordered w-full" type="email" formControlName="email" />@if (form.controls.email.touched && form.controls.email.invalid) { <span class="label-text-alt text-error">Introduce un correo válido.</span> }</label>
<label class="form-control"><span class="label-text">Contraseña</span><input class="input input-bordered w-full" type="password" formControlName="password" />@if (form.controls.password.touched && form.controls.password.invalid) { <span class="label-text-alt text-error">Usa 6-50 caracteres, mayúscula, minúscula y número o símbolo.</span> }</label>
<button class="btn btn-secondary w-full" type="submit" [disabled]="submitting()">@if (submitting()) { <span class="loading loading-spinner"></span> } Crear cuenta</button></form><p class="mt-6 text-center">¿Ya tienes cuenta? <a class="link link-secondary" routerLink="/auth/login">Inicia sesión</a></p></div>
