<article class="card h-full bg-base-100 shadow-sm transition hover:-translate-y-1 hover:shadow-lg animate-fadeIn">
  <figure class="aspect-square overflow-hidden bg-base-200">
    <img class="h-full w-full object-cover" [src]="song().coverUrl | songCover" [alt]="'Portada de ' + song().title" />
  </figure>
  <div class="card-body gap-2">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h2 class="card-title text-lg" [routerLink]="['/song', song().slug]">{{ song().title }}</h2>
        <p class="text-sm font-medium text-secondary">{{ song().artist }}</p>
      </div>
      <span class="badge badge-outline">{{ durationLabel() }}</span>
    </div>
    <p class="text-sm opacity-65">{{ song().album }} · {{ song().releaseYear }}</p>
    <p class="line-clamp-3 text-sm leading-relaxed opacity-75">{{ song().description }}</p>
    <div class="card-actions mt-2 justify-between items-center">
      <span class="badge badge-ghost">{{ song().genre.name }}</span>
      <a class="link link-secondary" [routerLink]="['/song', song().slug]">Ver canción</a>
    </div>
  </div>
</article>
